name: AI portfolio tests
on:
  push:
    paths: ['ai-portfolio/**', '.github/workflows/ai-portfolio.yml']
  pull_request:
    paths: ['ai-portfolio/**', '.github/workflows/ai-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: ai-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run application and runtime tests
        run: python3 -m unittest discover -s tests -v
      - name: Check every command-line example
        run: |
          python3 run.py knowledge-assistant
          python3 run.py support-agent
          python3 run.py invoice-validator
          python3 run.py security-investigator
          python3 run.py contract-review --as-of 2026-11-22
          python3 run.py proposal-studio
          python3 run.py meeting-actions
